name: yarima_wallet_pro
description: An financial tracking application designed for you
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.5+5

environment:
  sdk: '>=3.2.6 <4.0.0'

dependencies:
  file_picker: ^10.3.3
  flutter:
    sdk: flutter
  flutter_slidable: ^4.0.3
  flutter_speed_dial: ^7.0.0
  flutter_upgrade_version: ^1.1.5
  fluttertoast: ^9.0.0
  get_storage: ^2.1.1
  google_fonts: ^6.2.1
  google_sign_in: ^7.2.0
  googleapis: ^15.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  http: ^1.2.2
  in_app_review: ^2.0.9
  intl: ^0.20.2
  local_auth: ^3.0.0
  month_picker_dialog: ^6.5.0
  package_info_plus: ^9.0.0
  path_provider: ^2.1.2
  provider: ^6.1.2
  rxdart: ^0.28.0
  share_plus: ^12.0.0
  shared_preferences: ^2.2.3
  syncfusion_flutter_calendar: ^31.1.21
  syncfusion_flutter_charts: ^31.1.21
  syncfusion_flutter_pdf: ^31.1.21
  syncfusion_flutter_pdfviewer: ^31.1.21
  toggle_switch: ^2.1.0
  url_launcher: ^6.2.5
  uuid: ^4.2.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec
flutter_launcher_icons:
  image_path_android: 'assets/images/final-logo.png'
  android: true
# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    - assets/categories/
  #   - images/a_dot_ham.jpeg
  # example:
  fonts:
    - family: Arial
      fonts:
        - asset: assets/fonts/arial.ttf
